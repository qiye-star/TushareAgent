# demo-mcp — Web 控制台。
# 应用经 .env 的 TUSHARE_MCP_URL 连接 Tushare 官方 MCP（token 放 URL query），无需自建 MCP 服务。
# 内置 mcp_server/（本地代理→每接口工具）默认停用，仅作后备。
services:
  demo:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env            # DS_API_KEY / DS_MODEL / TUSHARE_MCP_URL（含 token）等
    environment:
      # 会话历史用 SQLite，且放进 volume 便于持久化
      DEMO_DATABASE_URL: sqlite+aiosqlite:////app/data/demo.db
    volumes:
      - demo_data:/app/data                      # 会话 demo.db（保留）
      - ./data/vectorstore:/app/data/vectorstore  # 共享本地已建好的 RAG 索引（has_index→load_index 快载，不重灌）
      - ./docs:/app/docs                          # 语料（RAG_CORPUS_DIR=docs 可解析；索引未命中时也可 ingest）
    restart: unless-stopped

volumes:
  demo_data:
