[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demomcp"
version = "0.1.0"
description = "可扩展的 LLM+MCP 数据对话助手（DeepSeek · MCP · Web/CLI）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<2",
    "mcp>=1.28,<2",
    "httpx>=0.28",
    "pydantic>=2",
    "pydantic-settings>=2.14",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "langgraph>=1.2.11",
]

# RAG 财报知识库后端（可选：仅在需要 PyMuPDF / 词法检索时安装）
# 嵌入走 OpenAI 兼容 /embeddings API（服务端 bge-m3），本地不加载 torch/模型，故无需 sentence-transformers/faiss
# 不进入默认 dependencies；用 uv sync --extra rag-full 安装
[project.optional-dependencies]
rag-full = [
    "pymilvus>=2.4",
    "milvus-lite>=2.4",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
]

# 开发工具（本地 uv sync 安装；容器用 uv sync --no-dev 跳过）
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16,<0.17",
    "pyright>=1.1.411",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demomcp*", "mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[[tool.uv.index]]
name = "aliyun"
default = true
url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "huawei"
url = "http://repo.huaweicloud.com/repository/pypi/simple"
